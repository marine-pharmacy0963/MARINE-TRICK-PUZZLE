<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MARINE TRICK PUZZLE MASTER</title>
<style>
:root{--bg:#eefbff;--card:#fff;--ink:#17394b;--a:#37b8d4;--b:#ffb84d;--line:#bfe6ef;--danger:#e85d75}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#dff8ff,#f8fdff);color:var(--ink)}
button,input{font:inherit}button{border:0;border-radius:13px;padding:10px 14px;font-weight:800;background:var(--a);color:#fff;cursor:pointer}button.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}button.warn{background:var(--danger)}button.gold{background:var(--b);color:#593a00}
.wrap{max-width:1080px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 8px 24px #4aa3b414}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.grow{flex:1}.muted,.help{font-size:12px;color:#678}.field{display:grid;gap:5px;min-width:150px}.field label{font-size:12px;font-weight:800}input{border:2px solid var(--line);border-radius:11px;padding:9px;min-width:0}
.registry{display:grid;gap:8px}.reg{display:grid;grid-template-columns:minmax(120px,1fr) minmax(120px,1fr) auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:#faffff}.id{font-family:ui-monospace,monospace;font-weight:900;color:#147d96;overflow-wrap:anywhere}
details{border:1px solid var(--line);border-radius:16px;margin:9px 0;overflow:hidden}summary{list-style:none;cursor:pointer;padding:11px;display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;font-weight:800}summary::-webkit-details-marker{display:none}summary:after{content:"▼";font-size:11px}details[open] summary:after{content:"▲"}.body{border-top:1px solid var(--line);padding:13px}.thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#eaf7fa}
.drop{border:2px dashed #69bfd2;border-radius:13px;padding:15px;text-align:center;background:#f5fdff;cursor:pointer}.drop.drag{background:#dcf8ff}.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:9px;margin-top:10px}.imgbox{border:1px solid var(--line);border-radius:12px;padding:7px;text-align:center}.imgbox img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.hidden{display:none!important}
#game{min-height:100vh}.center{text-align:center}.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:650px;margin:18px auto}.modes button{padding:22px;font-size:18px}
#board{width:min(88vw,560px);aspect-ratio:1;margin:16px auto;position:relative;background:#cdebf1;border:6px solid white;border-radius:18px;overflow:hidden;touch-action:none}.tile{position:absolute;background-repeat:no-repeat;border:1px solid #fff8;transition:left .15s,top .15s;touch-action:none}.correct{outline:3px solid #72d19a;outline-offset:-3px}#tray{min-height:100px;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:720px;margin:auto;padding:10px}.tray{width:74px;height:74px;background-repeat:no-repeat;border:2px solid white;border-radius:9px;box-shadow:0 3px 12px #1232;touch-action:none}
#done{position:fixed;inset:0;background:#07394cb8;display:grid;place-items:center;z-index:30;padding:18px}#done>div{background:#fff;border-radius:22px;padding:18px;width:min(92vw,560px);text-align:center}#done img{width:100%;max-height:55vh;object-fit:contain;border-radius:14px}
@media(max-width:650px){.reg{grid-template-columns:1fr auto}.reg .regName{grid-column:1/2}.modes{grid-template-columns:1fr}}
</style></head><body>
<main id="admin" class="wrap">
<div class="panel"><div class="row"><div class="grow"><h2 style="margin:0">🐠 MARINE TRICK PUZZLE MASTER</h2><div class="help">登録済みIDは下に常時表示。公開indexは管理処理を一切含まない独立HTMLとして生成します。</div></div><button class="alt" id="preview">▶ プレビュー</button></div></div>

<div class="panel"><h3>登録済みID <span id="idCount"></span></h3><div id="registry" class="registry"></div></div>

<div class="panel"><h3>＋ 新規キャラクター</h3><div class="row">
<div class="field"><label>ID</label><input id="newId" placeholder="famarin"></div><div class="field"><label>表示名</label><input id="newName" placeholder="ファマリン"></div>
<div class="field grow"><label>画像</label><div id="newDrop" class="drop">画像をドラッグ＆ドロップ<br><span class="muted">またはクリックして選択</span></div><input id="newFiles" type="file" accept="image/*" multiple hidden><span id="newCount" class="help">未選択</span></div><button id="add">追加</button></div></div>

<div class="panel"><div class="row"><h3 class="grow">キャラクター詳細</h3><button class="alt" id="closeAll">すべて閉じる</button></div><div id="details"></div></div>

<div class="panel"><h3>ゲーム・保存設定</h3><div class="row">
<div class="field grow"><label>キャラ紹介URL（IDを末尾に付加）</label><input id="profileBase"></div><div class="field"><label>はめる分割</label><input id="fitLevels"></div><div class="field"><label>スライド分割</label><input id="slideLevels"></div></div>
<div class="row" style="margin-top:12px"><button id="save">保存</button><button class="alt" id="jsonOut">JSON書き出し</button><button class="alt" id="jsonIn">JSON読込</button><input id="jsonFile" type="file" accept=".json" hidden><button class="gold" id="indexOut">公開 index.html 書き出し</button></div></div>
</main>

<section id="game" class="hidden"><div class="wrap"><div id="masterBack"><button class="alt" id="back">← MASTER</button></div>
<div id="select"><div class="center"><h2>キャラクターを選んでね！</h2></div><div id="choices"></div></div>
<div id="setup" class="hidden center"><img id="hero" class="thumb" style="width:110px;height:110px"><h2 id="gname"></h2><p>どっちで遊ぶ？</p><div class="modes"><button data-mode="fit">🧩 はめるパズル</button><button class="gold" data-mode="slide">↔️ スライドパズル</button></div><div id="levelBox" class="panel hidden"><h3>難易度を選ぶ</h3><p class="help">難易度はプレイヤーが毎回選べます。</p><div id="levels" class="row" style="justify-content:center"></div></div></div>
<div id="playing" class="hidden"><div class="center"><h2 id="title"></h2><span id="moves">0手</span> ・ <span id="time">00:00</span></div><div id="board"></div><div id="tray"></div><div class="row" style="justify-content:center"><button class="alt" id="restart">↻ シャッフル</button><button class="alt" id="quit">モード選択へ</button></div></div>
</div></section>
<div id="done" class="hidden"><div><h2>✨ COMPLETE! ✨</h2><img id="doneImg"><h3 id="doneName"></h3><p id="stats"></p><div class="row" style="justify-content:center"><button id="again">もう一度</button><button class="gold" id="profile">キャラ紹介へ戻る</button></div></div></div>
<script>
const KEY="mtpuzzle-master";
const DEF={profileBase:"../CHARACTER/index.html?char=",fitLevels:[2,3,4,5,6],slideLevels:[3,4,5,6],characters:[]};
let data=load(),pending=[],current=null,currentImage=0,mode=null,n=3,mv=0,started=0,timer=null,placed=0;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.characters)?x:structuredClone(DEF)}catch(e){return structuredClone(DEF)}}
function sync(){data.profileBase=$("#profileBase").value.trim();data.fitLevels=parseLevels($("#fitLevels").value,[2,3,4,5,6]);data.slideLevels=parseLevels($("#slideLevels").value,[3,4,5,6])}
function parseLevels(s,d){let a=s.split(",").map(Number).filter(x=>Number.isInteger(x)&&x>1&&x<10);return a.length?[...new Set(a)]:d}
function persist(){sync();localStorage.setItem(KEY,JSON.stringify(data))}
function fileData(f){return new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}
function bindDrop(zone,input,cb){zone.onclick=()=>input.click();input.onchange=()=>cb([...input.files]);["dragenter","dragover"].forEach(e=>zone.addEventListener(e,v=>{v.preventDefault();zone.classList.add("drag")}));["dragleave","drop"].forEach(e=>zone.addEventListener(e,v=>{v.preventDefault();zone.classList.remove("drag")}));zone.addEventListener("drop",e=>cb([...e.dataTransfer.files]))}
function render(){
 $("#profileBase").value=data.profileBase||DEF.profileBase;$("#fitLevels").value=(data.fitLevels||DEF.fitLevels).join(",");$("#slideLevels").value=(data.slideLevels||DEF.slideLevels).join(",");
 $("#idCount").textContent=`（${data.characters.length}件）`;
 $("#registry").innerHTML=data.characters.map((c,i)=>`<div class="reg"><div><div class="id">${esc(c.id||"(IDなし)")}</div><div class="regName">${esc(c.name||"(名前なし)")}</div></div><div class="muted">${(c.images||[]).length}画像</div><div class="row"><button class="alt regAdd" data-i="${i}">＋画像</button><input class="regFile" data-i="${i}" type="file" accept="image/*" multiple hidden><button class="warn regDel" data-i="${i}">削除</button></div></div>`).join("")||'<p class="muted">登録IDはありません。</p>';
 $("#details").innerHTML=data.characters.map((c,i)=>`<details data-i="${i}"><summary><img class="thumb" src="${c.images?.[0]||""}"><span>${esc(c.name||"名称未設定")}<div class="id">${esc(c.id||"")}</div></span></summary><div class="body"><div class="row"><div class="field"><label>ID</label><input class="cid" value="${esc(c.id||"")}"></div><div class="field"><label>表示名</label><input class="cname" value="${esc(c.name||"")}"></div><label><input class="pub" type="checkbox" ${c.published!==false?"checked":""}> 公開</label><button class="alt upd">変更保存</button></div><div class="drop moreDrop">画像をドラッグ＆ドロップ / クリックして追加</div><input class="moreFile" type="file" accept="image/*" multiple hidden><div class="imgs">${(c.images||[]).map((im,j)=>`<div class="imgbox"><img src="${im}"><div>画像 ${j+1}</div><button class="warn rmImg" data-j="${j}">削除</button></div>`).join("")||'<span class="muted">画像未登録</span>'}</div></div></details>`).join("")||'<p class="muted">登録なし</p>';
 bindRows()
}
function bindRows(){
 $$(".regAdd").forEach(b=>b.onclick=()=>document.querySelector(`.regFile[data-i="${b.dataset.i}"]`).click());
 $$(".regFile").forEach(x=>x.onchange=async()=>{let i=+x.dataset.i;await addImages(i,[...x.files]);});
 $$(".regDel").forEach(b=>b.onclick=()=>removeChar(+b.dataset.i));
 $$(".upd").forEach(b=>b.onclick=()=>{let d=b.closest("details"),i=+d.dataset.i,id=d.querySelector(".cid").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,""),name=d.querySelector(".cname").value.trim();if(!id||!name)return alert("IDと表示名が必要です");if(data.characters.some((c,k)=>k!==i&&c.id===id))return alert("そのIDは既に登録されています");data.characters[i].id=id;data.characters[i].name=name;data.characters[i].published=d.querySelector(".pub").checked;persist();render()});
 $$(".moreFile").forEach(x=>{let d=x.closest("details"),i=+d.dataset.i,zone=d.querySelector(".moreDrop");bindDrop(zone,x,files=>addImages(i,files))});
 $$(".rmImg").forEach(b=>b.onclick=()=>{let d=b.closest("details"),i=+d.dataset.i,j=+b.dataset.j;data.characters[i].images.splice(j,1);persist();render();document.querySelector(`details[data-i="${i}"]`)?.setAttribute("open","")})
}
async function addImages(i,files){for(const f of files.filter(f=>f.type.startsWith("image/")))data.characters[i].images.push(await fileData(f));persist();render()}
function removeChar(i){if(confirm(`ID「${data.characters[i]?.id||""}」を削除しますか？`)){data.characters.splice(i,1);persist();render()}}
async function addNew(){let id=$("#newId").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,""),name=$("#newName").value.trim();if(!id||!name)return alert("IDと表示名を入力してください");let i=data.characters.findIndex(c=>c.id===id);if(i>=0)return alert(`ID「${id}」は上の登録済みID一覧にあります。そこから画像追加・削除できます。`);let images=[];for(const f of pending)images.push(await fileData(f));data.characters.push({id,name,published:true,images});pending=[];$("#newId").value="";$("#newName").value="";$("#newFiles").value="";$("#newCount").textContent="未選択";persist();render()}
function dl(name,text,type){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function publicHTML(d){
 let payload=JSON.stringify(d).replace(/</g,"\\u003c");
 return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MARINE TRICK PUZZLE</title><style>${document.querySelector("style").textContent}</style></head><body>
<section id="game"><div class="wrap"><div id="select"><div class="center"><h2>キャラクターを選んでね！</h2></div><div id="choices"></div></div><div id="setup" class="hidden center"><img id="hero" class="thumb" style="width:110px;height:110px"><h2 id="gname"></h2><p>どっちで遊ぶ？</p><div class="modes"><button data-mode="fit">🧩 はめるパズル</button><button class="gold" data-mode="slide">↔️ スライドパズル</button></div><div id="levelBox" class="panel hidden"><h3>難易度を選ぶ</h3><p class="help">難易度はプレイヤーが毎回選べます。</p><div id="levels" class="row" style="justify-content:center"></div></div></div><div id="playing" class="hidden"><div class="center"><h2 id="title"></h2><span id="moves">0手</span> ・ <span id="time">00:00</span></div><div id="board"></div><div id="tray"></div><div class="row" style="justify-content:center"><button class="alt" id="restart">↻ シャッフル</button><button class="alt" id="quit">モード選択へ</button></div></div></div></section>
<div id="done" class="hidden"><div><h2>✨ COMPLETE! ✨</h2><img id="doneImg"><h3 id="doneName"></h3><p id="stats"></p><div class="row" style="justify-content:center"><button id="again">もう一度</button><button class="gold" id="profile">キャラ紹介へ戻る</button></div></div></div>
<script>const data=${payload};${gameRuntime.toString()};gameRuntime(data);<\/script></body></html>`
}
function gameRuntime(data){
 const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let current=null,currentImage=0,mode=null,n=3,mv=0,started=0,timer=null,placed=0;
 function img(){return current.images[currentImage]} function time(){let s=Math.floor((Date.now()-started)/1000);$("#time").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
 function bg(el,r,c){el.style.backgroundImage=`url("${img()}")`;el.style.backgroundSize=`${n*100}% ${n*100}%`;el.style.backgroundPosition=`${c*100/(n-1||1)}% ${r*100/(n-1||1)}%`}
 function select(){current=null;$("#select").classList.remove("hidden");$("#setup").classList.add("hidden");$("#playing").classList.add("hidden");let cs=data.characters.filter(c=>c.published!==false&&c.images&&c.images.length);$("#choices").innerHTML=cs.map(c=>`<div class="reg pick" data-id="${c.id}"><img class="thumb" src="${c.images[0]}"><b>${c.name}</b><button>このキャラで遊ぶ</button></div>`).join("")||"<p>遊べるキャラクターがありません。</p>";$$(".pick button").forEach(b=>b.onclick=()=>{current=cs.find(c=>c.id===b.closest(".pick").dataset.id);setup()})}
 function setup(){if(!current)return select();$("#select").classList.add("hidden");$("#setup").classList.remove("hidden");$("#playing").classList.add("hidden");$("#hero").src=img();$("#gname").textContent=current.name;$("#levelBox").classList.add("hidden")}
 $$(".modes button").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;let a=mode==="fit"?data.fitLevels:data.slideLevels;$("#levelBox").classList.remove("hidden");$("#levels").innerHTML=a.map(x=>`<button data-n="${x}">${x} × ${x}</button>`).join("");$("#levels").querySelectorAll("button").forEach(x=>x.onclick=()=>start(+x.dataset.n))});
 function start(x){n=x;mv=0;placed=0;started=Date.now();clearInterval(timer);timer=setInterval(time,500);$("#setup").classList.add("hidden");$("#playing").classList.remove("hidden");$("#title").textContent=`${current.name}｜${mode==="fit"?"はめる":"スライド"} ${n}×${n}`;$("#moves").textContent="0手";time();mode==="fit"?fit():slide()}
 function slide(){let b=$("#board");b.innerHTML="";$("#tray").innerHTML="";let total=n*n,a=[...Array(total).keys()],blank=total-1;for(let k=0;k<n*n*30;k++){let r=Math.floor(blank/n),c=blank%n,o=[];if(r)o.push(blank-n);if(r<n-1)o.push(blank+n);if(c)o.push(blank-1);if(c<n-1)o.push(blank+1);let p=o[Math.floor(Math.random()*o.length)];[a[blank],a[p]]=[a[p],a[blank]];blank=p}b.dataset.a=JSON.stringify(a);drawSlide()}
 function drawSlide(){let b=$("#board"),a=JSON.parse(b.dataset.a);b.innerHTML="";a.forEach((v,p)=>{if(v===n*n-1)return;let e=document.createElement("div"),r=Math.floor(p/n),c=p%n,rr=Math.floor(v/n),cc=v%n;e.className="tile";Object.assign(e.style,{width:100/n+"%",height:100/n+"%",left:c*100/n+"%",top:r*100/n+"%"});bg(e,rr,cc);e.onclick=()=>move(p);b.appendChild(e)})}
 function move(p){let b=$("#board"),a=JSON.parse(b.dataset.a),z=a.indexOf(n*n-1),r=Math.floor(p/n),c=p%n,zr=Math.floor(z/n),zc=z%n;if(Math.abs(r-zr)+Math.abs(c-zc)!==1)return;[a[p],a[z]]=[a[z],a[p]];b.dataset.a=JSON.stringify(a);mv++;$("#moves").textContent=mv+"手";drawSlide();if(a.every((v,i)=>v===i))done()}
 function fit(){let b=$("#board"),t=$("#tray");b.innerHTML="";t.innerHTML="";for(let i=0;i<n*n;i++){let s=document.createElement("div"),r=Math.floor(i/n),c=i%n;s.className="tile";s.dataset.slot=i;Object.assign(s.style,{width:100/n+"%",height:100/n+"%",left:c*100/n+"%",top:r*100/n+"%",background:"rgba(255,255,255,.25)"});b.appendChild(s)}[...Array(n*n).keys()].sort(()=>Math.random()-.5).forEach(i=>{let e=document.createElement("div");e.className="tray";e.draggable=true;e.dataset.piece=i;bg(e,Math.floor(i/n),i%n);e.addEventListener("dragstart",v=>v.dataTransfer.setData("text/plain",i));e.addEventListener("pointerdown",v=>{if(v.pointerType!=="mouse"){e.setPointerCapture(v.pointerId);e._d=true}});e.addEventListener("pointerup",v=>{if(e._d){e._d=false;let s=document.elementFromPoint(v.clientX,v.clientY)?.closest("[data-slot]");if(s)put(e,s)}});t.appendChild(e)})}
 $("#board").addEventListener("dragover",e=>e.preventDefault());$("#board").addEventListener("drop",e=>{e.preventDefault();let p=e.dataTransfer.getData("text/plain"),x=document.querySelector(`.tray[data-piece="${p}"]`),s=document.elementFromPoint(e.clientX,e.clientY)?.closest("[data-slot]");if(x&&s)put(x,s)});
 function put(e,s){mv++;$("#moves").textContent=mv+"手";if(e.dataset.piece===s.dataset.slot){let i=+e.dataset.piece;s.style.background="";bg(s,Math.floor(i/n),i%n);s.classList.add("correct");e.remove();if(++placed===n*n)done()}}
 function done(){clearInterval(timer);let sec=Math.floor((Date.now()-started)/1000);$("#doneImg").src=img();$("#doneName").textContent=current.name;$("#stats").textContent=`${mv}手・${Math.floor(sec/60)}分${sec%60}秒`;$("#done").classList.remove("hidden")}
 $("#restart").onclick=()=>start(n);$("#quit").onclick=setup;$("#again").onclick=()=>{$("#done").classList.add("hidden");start(n)};$("#profile").onclick=()=>location.href=(data.profileBase||"")+encodeURIComponent(current.id);
 let q=new URLSearchParams(location.search),id=q.get("char"),pic=Number(q.get("pic")||0),c=data.characters.find(x=>x.id===id&&x.published!==false&&x.images?.length);if(c){current=c;currentImage=Math.min(Math.max(pic,0),c.images.length-1);setup()}else select()
}
bindDrop($("#newDrop"),$("#newFiles"),files=>{pending=files.filter(f=>f.type.startsWith("image/"));$("#newCount").textContent=pending.length?`${pending.length}枚選択中`:"未選択"});
$("#add").onclick=addNew;$("#closeAll").onclick=()=>$$("details").forEach(d=>d.open=false);$("#save").onclick=()=>{persist();render();alert("保存しました")};
$("#jsonOut").onclick=()=>{persist();dl("MARINE_TRICK_PUZZLE_DATA.json",JSON.stringify(data,null,2),"application/json")};$("#jsonIn").onclick=()=>$("#jsonFile").click();$("#jsonFile").onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.characters))throw 0;data=x;localStorage.setItem(KEY,JSON.stringify(data));render()}catch(_){alert("JSONを読み込めませんでした")}};
$("#indexOut").onclick=()=>{try{persist();let h=publicHTML(data);if(!h.includes("const data=")||!h.includes("gameRuntime(data)"))throw Error("生成検証に失敗");dl("index.html",h,"text/html")}catch(e){console.error(e);alert("index書き出しに失敗："+e.message)}};
$("#preview").onclick=()=>{persist();$("#admin").classList.add("hidden");$("#game").classList.remove("hidden");$("#masterBack").classList.remove("hidden");gameRuntime(data)};$("#back").onclick=()=>location.reload();
render();
</script></body></html>
