<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MARINE TRICK PUZZLE MASTER</title>
<style>
:root{--ink:#17394b;--a:#31b6d2;--b:#ffb94f;--line:#bfe6ef;--danger:#e65d75;--bg:#effbff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(#dff8ff,#f9fdff)}
button,input{font:inherit}button{border:0;border-radius:13px;padding:10px 14px;font-weight:800;background:var(--a);color:#fff;cursor:pointer}.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}.warn{background:var(--danger)}.gold{background:var(--b);color:#5a3c00}
.wrap{max-width:1050px;margin:auto;padding:15px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 8px 25px #2b789312}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.field{display:grid;gap:5px;min-width:160px}.field label{font-size:12px;font-weight:900}.field input{border:2px solid var(--line);border-radius:11px;padding:9px;min-width:0}.help,.muted{font-size:12px;color:#678}
.drop{border:2px dashed #6bc2d4;border-radius:14px;padding:18px;text-align:center;background:#f5fdff;cursor:pointer}.drop.drag{background:#dcf8ff}
.card{border:1px solid var(--line);border-radius:17px;margin:10px 0;overflow:hidden}summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:10px}summary::-webkit-details-marker{display:none}summary:after{content:"▼";font-size:11px}details[open] summary:after{content:"▲"}.body{padding:13px;border-top:1px solid var(--line)}.thumb{width:62px;height:62px;object-fit:cover;border-radius:12px;background:#eaf7fa}.tag{display:inline-block;border-radius:999px;background:#e9faff;padding:3px 8px;font-size:11px;font-weight:900}.idtag{background:#fff4d9;color:#765100}.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;margin-top:10px}.imgbox{border:1px solid var(--line);border-radius:12px;padding:7px;text-align:center}.imgbox img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.hidden{display:none!important}.choice{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px;margin:8px auto;max-width:650px}.center{text-align:center}.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:650px;margin:18px auto}.modes button{padding:22px;font-size:18px}
#board{width:min(88vw,560px);aspect-ratio:1;margin:16px auto;position:relative;background:#cdebf1;border:6px solid white;border-radius:18px;overflow:hidden;touch-action:none}.tile{position:absolute;background-repeat:no-repeat;border:1px solid #fff8;transition:left .15s,top .15s;touch-action:none}.correct{outline:3px solid #72d19a;outline-offset:-3px}#tray{min-height:100px;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:720px;margin:auto;padding:10px}.tray{width:74px;height:74px;background-repeat:no-repeat;border:2px solid white;border-radius:9px;box-shadow:0 3px 12px #1232;touch-action:none}
#done{position:fixed;inset:0;background:#07394cbd;display:grid;place-items:center;z-index:30;padding:18px}#done>div{background:#fff;border-radius:22px;padding:18px;width:min(92vw,560px);text-align:center}#done img{width:100%;max-height:55vh;object-fit:contain;border-radius:14px}
@media(max-width:620px){.modes{grid-template-columns:1fr}.choice{grid-template-columns:60px 1fr}.choice button{grid-column:1/3}}
</style></head><body>
<main id="admin" class="wrap">
<div class="panel"><div class="row"><div class="grow"><h2 style="margin:0">🧩 MARINE TRICK PUZZLE MASTER</h2><p class="help">キャラクターが本体。連携IDは登録後に必要なキャラだけ設定します。</p></div><button class="alt" id="preview">▶ プレビュー</button></div></div>

<div class="panel"><h3>＋ キャラクター登録</h3><div class="row"><div class="field"><label>キャラクター名</label><input id="newName" placeholder="ファマリン"></div><div class="field grow"><label>パズル画像</label><div class="drop" id="newDrop">画像をドラッグ＆ドロップ<br><span class="muted">またはクリックして選択・複数可</span></div><input id="newFiles" type="file" accept="image/*" multiple hidden><span id="newCount" class="help">未選択</span></div><button id="add">登録</button></div></div>

<div class="panel"><div class="row"><h3 class="grow">登録済みキャラクター <span id="count"></span></h3><button class="alt" id="closeAll">すべて閉じる</button></div><div id="list"></div></div>

<div class="panel"><h3>共通設定・保存</h3><div class="row"><div class="field grow"><label>キャラ紹介ページの基本URL</label><input id="profileBase" placeholder="../CHARACTER/index.html?char="></div><div class="field"><label>はめる難易度</label><input id="fitLevels"></div><div class="field"><label>スライド難易度</label><input id="slideLevels"></div></div>
<div class="row" style="margin-top:12px"><button id="save">保存</button><button class="alt" id="jsonOut">JSON書き出し</button><button class="alt" id="jsonIn">JSON読込</button><input id="jsonFile" type="file" accept=".json" hidden><button class="gold" id="indexOut">公開 index.html 書き出し</button></div></div>
</main>

<section id="game" class="hidden"><div class="wrap"><div id="masterOnly"><button class="alt" id="back">← MASTER</button></div><div id="select"><div class="center"><h2>キャラクターを選んでね！</h2></div><div id="choices"></div></div><div id="setup" class="hidden center"><img id="hero" class="thumb" style="width:110px;height:110px"><h2 id="gname"></h2><div id="picChoice"></div><p>どっちで遊ぶ？</p><div class="modes"><button data-mode="fit">🧩 はめるパズル</button><button class="gold" data-mode="slide">↔️ スライドパズル</button></div><div id="levelBox" class="panel hidden"><h3>難易度を選ぶ</h3><p class="help">プレイヤーが毎回選べます。</p><div id="levels" class="row" style="justify-content:center"></div></div></div><div id="playing" class="hidden"><div class="center"><h2 id="title"></h2><span id="moves">0手</span> ・ <span id="time">00:00</span></div><div id="board"></div><div id="tray"></div><div class="row" style="justify-content:center"><button class="alt" id="restart">↻ シャッフル</button><button class="alt" id="quit">モード選択へ</button></div></div></div></section>
<div id="done" class="hidden"><div><h2>✨ COMPLETE! ✨</h2><img id="doneImg"><h3 id="doneName"></h3><p id="stats"></p><div class="row" style="justify-content:center"><button id="again">もう一度</button><button class="gold" id="profile">キャラ紹介へ戻る</button></div></div></div>

<script>
const KEY="marine-trick-puzzle-v3";
const DEF={profileBase:"../CHARACTER/index.html?char=",fitLevels:[2,3,4,5,6],slideLevels:[3,4,5,6],characters:[]};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let data=load(),pending=[];
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.characters)?x:structuredClone(DEF)}catch(e){return structuredClone(DEF)}}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function levels(s,f){let a=s.split(",").map(Number).filter(x=>Number.isInteger(x)&&x>1&&x<10);return a.length?[...new Set(a)]:f}
function sync(){data.profileBase=$("#profileBase").value.trim();data.fitLevels=levels($("#fitLevels").value,DEF.fitLevels);data.slideLevels=levels($("#slideLevels").value,DEF.slideLevels)}
function persist(){sync();localStorage.setItem(KEY,JSON.stringify(data))}
function fileData(f){return new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}
function bindDrop(z,i,cb){z.onclick=()=>i.click();i.onchange=()=>cb([...i.files]);["dragenter","dragover"].forEach(e=>z.addEventListener(e,v=>{v.preventDefault();z.classList.add("drag")}));["dragleave","drop"].forEach(e=>z.addEventListener(e,v=>{v.preventDefault();z.classList.remove("drag")}));z.addEventListener("drop",e=>cb([...e.dataTransfer.files]))}
async function addImages(i,files){for(const f of files.filter(f=>f.type.startsWith("image/")))data.characters[i].images.push(await fileData(f));persist();render()}
function render(){
 $("#profileBase").value=data.profileBase||DEF.profileBase;$("#fitLevels").value=(data.fitLevels||DEF.fitLevels).join(",");$("#slideLevels").value=(data.slideLevels||DEF.slideLevels).join(",");$("#count").textContent=`（${data.characters.length}）`;
 $("#list").innerHTML=data.characters.map((c,i)=>`<details class="card" data-i="${i}"><summary><img class="thumb" src="${c.images?.[0]||""}"><div><b>${esc(c.name)}</b><div><span class="tag">${(c.images||[]).length}画像</span> ${c.linkId?`<span class="tag idtag">ID: ${esc(c.linkId)}</span>`:'<span class="tag">ID未設定</span>'}</div></div></summary><div class="body"><div class="row"><div class="field grow"><label>キャラクター名</label><input class="name" value="${esc(c.name)}"></div><label><input class="pub" type="checkbox" ${c.published!==false?"checked":""}> 公開</label><button class="alt saveChar">変更保存</button><button class="warn delChar">削除</button></div>
 <div class="panel" style="box-shadow:none;margin:12px 0"><b>🔗 キャラ紹介との連携ID</b><p class="help">IDは後から設定できます。重複IDを保存すると、確認後に以前のキャラからIDを外してこのキャラへ移します。</p><div class="row"><div class="field grow"><label>連携ID</label><input class="linkId" value="${esc(c.linkId||"")}" placeholder="例: famarin"></div><button class="gold saveId">IDを設定</button><button class="alt clearId">IDを外す</button></div>${c.linkId?`<p class="help">公開URL: index.html?char=${encodeURIComponent(c.linkId)}</p>`:""}</div>
 <div class="drop moreDrop">＋ 画像をドラッグ＆ドロップ / クリックして追加</div><input class="moreFile" type="file" accept="image/*" multiple hidden><div class="imgs">${(c.images||[]).map((im,j)=>`<div class="imgbox"><img src="${im}"><div>画像 ${j+1}</div><button class="warn rmImg" data-j="${j}">削除</button></div>`).join("")||'<span class="muted">画像なし</span>'}</div></div></details>`).join("")||'<p class="muted">まだキャラクターはいません。</p>';
 bindRows()
}
function bindRows(){
 $$(".saveChar").forEach(b=>b.onclick=()=>{let d=b.closest("details"),i=+d.dataset.i,n=d.querySelector(".name").value.trim();if(!n)return alert("名前を入力してください");data.characters[i].name=n;data.characters[i].published=d.querySelector(".pub").checked;persist();render()});
 $$(".saveId").forEach(b=>b.onclick=()=>{let d=b.closest("details"),i=+d.dataset.i,id=d.querySelector(".linkId").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");if(!id)return alert("IDを入力してください");let old=data.characters.findIndex((c,k)=>k!==i&&c.linkId===id);if(old>=0){if(!confirm(`ID「${id}」は「${data.characters[old].name}」で使用中です。\n以前のIDを外して「${data.characters[i].name}」へ付け替えますか？`))return;data.characters[old].linkId=""}data.characters[i].linkId=id;persist();render();alert(`ID「${id}」を設定しました`)});
 $$(".clearId").forEach(b=>b.onclick=()=>{let d=b.closest("details"),i=+d.dataset.i;data.characters[i].linkId="";persist();render()});
 $$(".delChar").forEach(b=>b.onclick=()=>{let d=b.closest("details"),i=+d.dataset.i;if(confirm(`「${data.characters[i].name}」を削除しますか？\n設定IDも一緒に消えます。`)){data.characters.splice(i,1);persist();render()}});
 $$(".moreFile").forEach(x=>{let d=x.closest("details"),i=+d.dataset.i;bindDrop(d.querySelector(".moreDrop"),x,f=>addImages(i,f))});
 $$(".rmImg").forEach(b=>b.onclick=()=>{let d=b.closest("details"),i=+d.dataset.i,j=+b.dataset.j;data.characters[i].images.splice(j,1);persist();render();document.querySelector(`details[data-i="${i}"]`)?.setAttribute("open","")})
}
async function addNew(){let name=$("#newName").value.trim();if(!name)return alert("キャラクター名を入力してください");let imgs=[];for(const f of pending)imgs.push(await fileData(f));data.characters.push({name,linkId:"",published:true,images:imgs});pending=[];$("#newName").value="";$("#newFiles").value="";$("#newCount").textContent="未選択";persist();render()}
function dl(name,text,type){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function gameRuntime(data,master){
 const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let current=null,pic=0,mode=null,n=3,mv=0,started=0,timer=null,placed=0;
 const image=()=>current.images[pic];function tick(){let s=Math.floor((Date.now()-started)/1000);$("#time").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
 function bg(e,r,c){e.style.backgroundImage=`url("${image()}")`;e.style.backgroundSize=`${n*100}% ${n*100}%`;e.style.backgroundPosition=`${c*100/(n-1||1)}% ${r*100/(n-1||1)}%`}
 function choose(){current=null;$("#select").classList.remove("hidden");$("#setup").classList.add("hidden");$("#playing").classList.add("hidden");let cs=data.characters.filter(c=>c.published!==false&&c.images?.length);$("#choices").innerHTML=cs.map((c,i)=>`<div class="choice" data-i="${i}"><img class="thumb" src="${c.images[0]}"><div><b>${c.name}</b><div class="muted">${c.images.length}画像</div></div><button>このキャラで遊ぶ</button></div>`).join("")||"<p class=center>遊べるキャラクターがありません。</p>";$$(".choice button").forEach(b=>b.onclick=()=>{current=cs[+b.closest(".choice").dataset.i];pic=0;setup()})}
 function setup(){if(!current)return choose();$("#select").classList.add("hidden");$("#setup").classList.remove("hidden");$("#playing").classList.add("hidden");$("#hero").src=image();$("#gname").textContent=current.name;$("#levelBox").classList.add("hidden");$("#picChoice").innerHTML=current.images.length>1?`<div class="row" style="justify-content:center">${current.images.map((x,i)=>`<button class="${i===pic?"":"alt"} pic" data-i="${i}">画像${i+1}</button>`).join("")}</div>`:"";$$(".pic").forEach(b=>b.onclick=()=>{pic=+b.dataset.i;setup()})}
 $$(".modes button").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;let a=mode==="fit"?data.fitLevels:data.slideLevels;$("#levelBox").classList.remove("hidden");$("#levels").innerHTML=a.map(x=>`<button data-n="${x}">${x} × ${x}</button>`).join("");$("#levels button").forEach(x=>x.onclick=()=>start(+x.dataset.n))});
 function start(x){n=x;mv=0;placed=0;started=Date.now();clearInterval(timer);timer=setInterval(tick,500);$("#setup").classList.add("hidden");$("#playing").classList.remove("hidden");$("#title").textContent=`${current.name}｜${mode==="fit"?"はめる":"スライド"} ${n}×${n}`;$("#moves").textContent="0手";tick();mode==="fit"?fit():slide()}
 function slide(){let b=$("#board");b.innerHTML="";$("#tray").innerHTML="";let a=[...Array(n*n).keys()],z=n*n-1;for(let k=0;k<n*n*35;k++){let r=Math.floor(z/n),c=z%n,o=[];if(r)o.push(z-n);if(r<n-1)o.push(z+n);if(c)o.push(z-1);if(c<n-1)o.push(z+1);let p=o[Math.floor(Math.random()*o.length)];[a[z],a[p]]=[a[p],a[z]];z=p}b.dataset.a=JSON.stringify(a);drawSlide()}
 function drawSlide(){let b=$("#board"),a=JSON.parse(b.dataset.a);b.innerHTML="";a.forEach((v,p)=>{if(v===n*n-1)return;let e=document.createElement("div"),r=Math.floor(p/n),c=p%n,rr=Math.floor(v/n),cc=v%n;e.className="tile";Object.assign(e.style,{width:100/n+"%",height:100/n+"%",left:c*100/n+"%",top:r*100/n+"%"});bg(e,rr,cc);e.onclick=()=>move(p);b.appendChild(e)})}
 function move(p){let b=$("#board"),a=JSON.parse(b.dataset.a),z=a.indexOf(n*n-1),r=Math.floor(p/n),c=p%n,zr=Math.floor(z/n),zc=z%n;if(Math.abs(r-zr)+Math.abs(c-zc)!==1)return;[a[p],a[z]]=[a[z],a[p]];b.dataset.a=JSON.stringify(a);mv++;$("#moves").textContent=mv+"手";drawSlide();if(a.every((v,i)=>v===i))done()}
 function fit(){let b=$("#board"),t=$("#tray");b.innerHTML="";t.innerHTML="";for(let i=0;i<n*n;i++){let s=document.createElement("div"),r=Math.floor(i/n),c=i%n;s.className="tile";s.dataset.slot=i;Object.assign(s.style,{width:100/n+"%",height:100/n+"%",left:c*100/n+"%",top:r*100/n+"%",background:"rgba(255,255,255,.24)"});b.appendChild(s)}[...Array(n*n).keys()].sort(()=>Math.random()-.5).forEach(i=>{let e=document.createElement("div");e.className="tray";e.draggable=true;e.dataset.piece=i;bg(e,Math.floor(i/n),i%n);e.addEventListener("dragstart",v=>v.dataTransfer.setData("text/plain",i));e.addEventListener("pointerup",v=>{if(v.pointerType!=="mouse"){let s=document.elementFromPoint(v.clientX,v.clientY)?.closest("[data-slot]");if(s)put(e,s)}});t.appendChild(e)})}
 $("#board").ondragover=e=>e.preventDefault();$("#board").ondrop=e=>{e.preventDefault();let p=e.dataTransfer.getData("text/plain"),x=document.querySelector(`.tray[data-piece="${p}"]`),s=document.elementFromPoint(e.clientX,e.clientY)?.closest("[data-slot]");if(x&&s)put(x,s)};
 function put(e,s){mv++;$("#moves").textContent=mv+"手";if(e.dataset.piece===s.dataset.slot){let i=+e.dataset.piece;s.style.background="";bg(s,Math.floor(i/n),i%n);s.classList.add("correct");e.remove();if(++placed===n*n)done()}}
 function done(){clearInterval(timer);let sec=Math.floor((Date.now()-started)/1000);$("#doneImg").src=image();$("#doneName").textContent=current.name;$("#stats").textContent=`${mv}手・${Math.floor(sec/60)}分${sec%60}秒`;$("#done").classList.remove("hidden")}
 $("#restart").onclick=()=>start(n);$("#quit").onclick=setup;$("#again").onclick=()=>{$("#done").classList.add("hidden");start(n)};$("#profile").onclick=()=>{if(current.linkId)location.href=(data.profileBase||"")+encodeURIComponent(current.linkId);else alert("このキャラクターには紹介ページ連携IDが設定されていません。")};
 let q=new URLSearchParams(location.search),id=q.get("char"),found=id?data.characters.find(c=>c.linkId===id&&c.published!==false&&c.images?.length):null;if(found){current=found;pic=Math.min(Math.max(Number(q.get("pic")||0),0),found.images.length-1);setup()}else choose()
}
function publicHTML(d){
 const css=document.querySelector("style").textContent,payload=JSON.stringify(d).replace(/</g,"\\u003c");
 const game=document.querySelector("#game").outerHTML.replace('class="hidden"','').replace(/<div id="masterOnly">[\s\S]*?<\/div>/,'');
 const done=document.querySelector("#done").outerHTML;
 return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MARINE TRICK PUZZLE</title><style>${css}</style></head><body>${game}${done}<script>const data=${payload};(${gameRuntime.toString()})(data,false);<\/script></body></html>`
}
bindDrop($("#newDrop"),$("#newFiles"),f=>{pending=f.filter(x=>x.type.startsWith("image/"));$("#newCount").textContent=pending.length?`${pending.length}枚選択中`:"未選択"});
$("#add").onclick=addNew;$("#closeAll").onclick=()=>$$("details").forEach(d=>d.open=false);$("#save").onclick=()=>{persist();alert("保存しました")};
$("#jsonOut").onclick=()=>{persist();dl("MARINE_TRICK_PUZZLE_DATA.json",JSON.stringify(data,null,2),"application/json")};$("#jsonIn").onclick=()=>$("#jsonFile").click();$("#jsonFile").onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.characters))throw 0;data=x;localStorage.setItem(KEY,JSON.stringify(data));render()}catch(_){alert("JSONを読み込めませんでした")}};
$("#indexOut").onclick=()=>{try{persist();let h=publicHTML(data);if(!h.includes("gameRuntime")||!h.includes("const data="))throw Error("生成検証NG");dl("index.html",h,"text/html")}catch(e){alert("index書き出し失敗："+e.message)}};
$("#preview").onclick=()=>{persist();$("#admin").classList.add("hidden");$("#game").classList.remove("hidden");gameRuntime(data,true)};$("#back").onclick=()=>location.reload();
render();
</script></body></html>
