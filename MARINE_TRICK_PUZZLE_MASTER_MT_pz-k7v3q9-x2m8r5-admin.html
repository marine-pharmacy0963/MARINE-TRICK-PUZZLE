<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARINE TRICK PUZZLE MASTER</title><style>
:root{--ink:#17394b;--a:#27b4d0;--line:#b9e3ec;--bg:#effbff;--bad:#e65e76;--gold:#ffbd55}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#dff8ff,#fbfeff);color:var(--ink)}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;background:var(--a);color:#fff;font-weight:800;cursor:pointer}.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}.bad{background:var(--bad)}.gold{background:var(--gold);color:#563700}.wrap{max-width:1050px;margin:auto;padding:15px}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px;margin:13px 0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.field{display:grid;gap:5px;min-width:150px}.field label,.help{font-size:12px}.field label{font-weight:800}.help{color:#678}input,select{border:2px solid var(--line);border-radius:10px;padding:9px;min-width:0}.drop{border:2px dashed #66bfd2;border-radius:13px;padding:16px;text-align:center;background:#f5fdff;cursor:pointer}.drop.drag{background:#dff8ff}details.char{border:1px solid var(--line);border-radius:15px;margin:9px 0;overflow:hidden}summary{list-style:none;cursor:pointer;padding:10px;display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center}summary::-webkit-details-marker{display:none}summary:after{content:"▼"}details[open] summary:after{content:"▲"}.thumb{width:58px;height:58px;object-fit:cover;border-radius:10px;background:#eaf7fa}.body{padding:13px;border-top:1px solid var(--line)}.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 7px;border-radius:99px;background:#e8faff}.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}.imgbox{border:1px solid var(--line);padding:6px;border-radius:10px;text-align:center}.imgbox img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px}.hidden{display:none!important}.center{text-align:center}.choice{max-width:650px;margin:8px auto;background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px;display:grid;grid-template-columns:60px 1fr auto;gap:9px;align-items:center}.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:650px;margin:15px auto}.modes button{padding:20px;font-size:18px}#board{width:min(88vw,560px);aspect-ratio:1;position:relative;margin:15px auto;background:#cceaf1;border:5px solid #fff;border-radius:16px;overflow:hidden;touch-action:none}.tile{position:absolute;background-repeat:no-repeat;border:1px solid #fff8}.tray{width:72px;height:72px;background-repeat:no-repeat;border:2px solid white;border-radius:8px;box-shadow:0 2px 9px #1233;touch-action:none}#tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:720px;margin:auto;min-height:90px}#done{position:fixed;inset:0;background:#06394bbb;z-index:30;display:grid;place-items:center;padding:15px}#done>div{width:min(92vw,560px);background:#fff;border-radius:20px;padding:16px;text-align:center}#done img{max-width:100%;max-height:55vh;object-fit:contain;border-radius:12px}@media(max-width:620px){.modes{grid-template-columns:1fr}.choice{grid-template-columns:58px 1fr}.choice button{grid-column:1/3}}
</style></head><body>
<main id="master" class="wrap">
<div class="panel"><h2 style="margin:0">🧩 MARINE TRICK PUZZLE MASTER</h2><p class="help">キャラクターを登録 → 必要なら連携IDを設定 → 公開indexを書き出し。</p></div>
<div class="panel"><div class="row"><h3 class="grow">登録キャラクター <span id="count"></span></h3><button class="alt" id="fold">すべて閉じる</button></div>
<details open class="char"><summary><div style="font-size:35px">＋</div><div><b>キャラクターを追加</b><div class="help">ここから新規登録</div></div></summary><div class="body">
<div class="row"><div class="field"><label>キャラクター名</label><input id="newName" placeholder="ファマリン"></div><div class="field grow"><label>画像</label><div class="drop" id="newDrop">画像をドラッグ＆ドロップ<br><span class="help">またはクリック・複数可</span></div><input id="newFiles" type="file" accept="image/*" multiple hidden><span id="newInfo" class="help">未選択</span></div><button id="add">このキャラを登録</button></div></div></details>
<div id="chars"></div></div>
<div class="panel"><h3>画像圧縮</h3><div class="row"><label>圧縮 <select id="compress"><option value="on">ON</option><option value="off">OFF</option></select></label><label>最大辺 <select id="maxpx"><option>800</option><option selected>1200</option><option>1600</option><option>2000</option></select>px</label><label>JPEG/WebP品質 <select id="quality"><option value=".7">70%</option><option value=".82" selected>82%</option><option value=".9">90%</option></select></label></div><p class="help">PNG透過画像は透過を維持して縮小。JPEG/WebPは指定品質で圧縮します。</p></div>
<div class="panel"><h3>共通設定</h3><div class="row"><div class="field grow"><label>キャラ紹介 基本URL</label><input id="profileBase" value="../CHARACTER/index.html?char="></div><div class="field"><label>はめる難易度</label><input id="fit" value="2,3,4,5,6"></div><div class="field"><label>スライド難易度</label><input id="slide" value="3,4,5,6"></div></div><div class="row" style="margin-top:12px"><button id="save">保存</button><button class="alt" id="jsonOut">JSON書出</button><button class="alt" id="jsonIn">JSON読込</button><input id="jsonFile" type="file" accept=".json" hidden><button class="gold" id="export">公開 index.html 書き出し</button></div></div>
</main>
<script>
const KEY="mtpz-clean-1",D={profileBase:"../CHARACTER/index.html?char=",fit:[2,3,4,5,6],slide:[3,4,5,6],compress:"on",maxpx:1200,quality:.82,characters:[]};let data=load(),pending=[];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.characters)?x:structuredClone(D)}catch(e){return structuredClone(D)}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function nums(s,f){let a=s.split(",").map(Number).filter(x=>Number.isInteger(x)&&x>1&&x<10);return a.length?[...new Set(a)]:f}
function sync(){data.profileBase=$("#profileBase").value.trim();data.fit=nums($("#fit").value,D.fit);data.slide=nums($("#slide").value,D.slide);data.compress=$("#compress").value;data.maxpx=+$("#maxpx").value;data.quality=+$("#quality").value}
function save(){sync();localStorage.setItem(KEY,JSON.stringify(data))}
function drop(z,i,cb){z.onclick=()=>i.click();i.onchange=()=>cb([...i.files]);["dragenter","dragover"].forEach(x=>z.addEventListener(x,e=>{e.preventDefault();z.classList.add("drag")}));["dragleave","drop"].forEach(x=>z.addEventListener(x,e=>{e.preventDefault();z.classList.remove("drag")}));z.addEventListener("drop",e=>cb([...e.dataTransfer.files]))}
function rawData(f){return new Promise(r=>{let x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)})}
async function imageData(f){if(data.compress!=="on")return rawData(f);return new Promise(async resolve=>{let url=await rawData(f),im=new Image;im.onload=()=>{let scale=Math.min(1,data.maxpx/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext("2d").drawImage(im,0,0,c.width,c.height);let transparent=f.type==="image/png",type=transparent?"image/png":(f.type==="image/webp"?"image/webp":"image/jpeg");resolve(c.toDataURL(type,transparent?undefined:data.quality))};im.src=url})}
function render(){sync();$("#count").textContent=`（${data.characters.length}）`;$("#chars").innerHTML=data.characters.map((c,i)=>`<details class="char" data-i="${i}"><summary><img class="thumb" src="${c.images[0]||""}"><div><b>${esc(c.name)}</b><div><span class="tag">${c.images.length}画像</span> <span class="tag">${c.linkId?"ID: "+esc(c.linkId):"ID未設定"}</span></div></div></summary><div class="body">
<div class="row"><div class="field grow"><label>名前</label><input class="nm" value="${esc(c.name)}"></div><label><input class="pub" type="checkbox" ${c.published!==false?"checked":""}>公開</label><button class="alt upd">変更保存</button><button class="bad del">削除</button></div>
<div class="panel" style="box-shadow:none"><b>連携ID（任意）</b><p class="help">重複時は確認後、前のキャラからIDを外してこちらへ移します。</p><div class="row"><input class="lid grow" value="${esc(c.linkId||"")}" placeholder="famarin"><button class="gold setid">ID設定</button><button class="alt clearid">ID解除</button></div></div>
<div class="drop addDrop">＋画像をドラッグ＆ドロップ / クリック</div><input class="addFile" type="file" accept="image/*" multiple hidden><div class="imgs">${c.images.map((x,j)=>`<div class="imgbox"><img src="${x}"><div>画像${j+1}</div><button class="bad rm" data-j="${j}">削除</button></div>`).join("")||'<span class="help">画像なし</span>'}</div></div></details>`).join("");bindRows()}
function bindRows(){
 $$(".upd").forEach(b=>b.onclick=()=>{let d=b.closest("details"),i=+d.dataset.i,n=d.querySelector(".nm").value.trim();if(!n)return alert("名前が必要です");data.characters[i].name=n;data.characters[i].published=d.querySelector(".pub").checked;save();render()});
 $$(".del").forEach(b=>b.onclick=()=>{let d=b.closest("details"),i=+d.dataset.i;if(confirm(`「${data.characters[i].name}」を削除しますか？`)){data.characters.splice(i,1);save();render()}});
 $$(".setid").forEach(b=>b.onclick=()=>{let d=b.closest("details"),i=+d.dataset.i,id=d.querySelector(".lid").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");if(!id)return alert("IDを入力してください");let o=data.characters.findIndex((c,k)=>k!==i&&c.linkId===id);if(o>=0&&!confirm(`ID「${id}」は「${data.characters[o].name}」で使用中です。以前のIDを外して上書きしますか？`))return;if(o>=0)data.characters[o].linkId="";data.characters[i].linkId=id;save();render()});
 $$(".clearid").forEach(b=>b.onclick=()=>{let i=+b.closest("details").dataset.i;data.characters[i].linkId="";save();render()});
 $$(".addFile").forEach(x=>{let d=x.closest("details"),i=+d.dataset.i;drop(d.querySelector(".addDrop"),x,async fs=>{sync();for(const f of fs.filter(x=>x.type.startsWith("image/")))data.characters[i].images.push(await imageData(f));save();render();document.querySelector(`details[data-i="${i}"]`)?.setAttribute("open","")})});
 $$(".rm").forEach(b=>b.onclick=()=>{let d=b.closest("details"),i=+d.dataset.i,j=+b.dataset.j;data.characters[i].images.splice(j,1);save();render();document.querySelector(`details[data-i="${i}"]`)?.setAttribute("open","")})
}
async function addChar(){sync();let n=$("#newName").value.trim();if(!n)return alert("キャラクター名を入力してください");let images=[];for(const f of pending)images.push(await imageData(f));data.characters.push({name:n,linkId:"",published:true,images});save();pending=[];$("#newName").value="";$("#newFiles").value="";$("#newInfo").textContent="未選択";render();let all=$$("#chars details");all.at(-1)?.setAttribute("open","")}
function dl(n,t,type){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([t],{type}));a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function gameHTML(){let d=JSON.stringify(data).replace(/</g,"\\u003c"),css=document.querySelector("style").textContent;return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARINE TRICK PUZZLE</title><style>${css}</style></head><body><main class="wrap"><div id="select"><h2 class="center">キャラクターを選んでね！</h2><div id="choices"></div></div><div id="setup" class="hidden center"><img id="hero" class="thumb" style="width:110px;height:110px"><h2 id="gn"></h2><div id="pics"></div><div class="modes"><button data-m="fit">🧩 はめる</button><button class="gold" data-m="slide">↔️ スライド</button></div><div id="lvbox" class="panel hidden"><h3>難易度を選ぶ</h3><div id="lvs" class="row" style="justify-content:center"></div></div></div><div id="play" class="hidden"><div class="center"><h2 id="ttl"></h2><span id="moves">0手</span> ・ <span id="tm">00:00</span></div><div id="board"></div><div id="tray"></div><div class="row" style="justify-content:center"><button class="alt" id="restart">↻やり直す</button><button class="alt" id="quit">戻る</button></div></div></main><div id="done" class="hidden"><div><h2>✨ COMPLETE! ✨</h2><img id="doneImg"><h3 id="doneName"></h3><p id="stat"></p><div class="row" style="justify-content:center"><button id="again">もう一度</button><button class="gold" id="profile">キャラ紹介へ</button></div></div></div><script>const DATA=${d};(${runtime.toString()})(DATA);<\/script></body></html>`}
function runtime(DATA){const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let c=null,pic=0,mode="",n=3,mv=0,start=0,timer,placed=0;const im=()=>c.images[pic];function tick(){let s=Math.floor((Date.now()-start)/1000);$("#tm").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}function bg(e,r,col){e.style.backgroundImage=`url("${im()}")`;e.style.backgroundSize=`${n*100}% ${n*100}%`;e.style.backgroundPosition=`${col*100/(n-1||1)}% ${r*100/(n-1||1)}%`}
function choose(){let a=DATA.characters.filter(x=>x.published!==false&&x.images.length);$("#select").classList.remove("hidden");$("#setup").classList.add("hidden");$("#play").classList.add("hidden");$("#choices").innerHTML=a.map((x,i)=>`<div class="choice" data-i="${i}"><img class="thumb" src="${x.images[0]}"><b>${x.name}</b><button>遊ぶ</button></div>`).join("")||"<p class=center>公開中のキャラクターがありません。</p>";$$(".choice button").forEach(b=>b.onclick=()=>{c=a[+b.closest(".choice").dataset.i];pic=0;setup()})}function setup(){if(!c)return choose();$("#select").classList.add("hidden");$("#setup").classList.remove("hidden");$("#play").classList.add("hidden");$("#hero").src=im();$("#gn").textContent=c.name;$("#lvbox").classList.add("hidden");$("#pics").innerHTML=c.images.length>1?c.images.map((x,i)=>`<button class="${i===pic?"":"alt"} p" data-i="${i}">画像${i+1}</button>`).join(" "):"";$$(".p").forEach(b=>b.onclick=()=>{pic=+b.dataset.i;setup()})}
$$(".modes button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;let a=mode==="fit"?DATA.fit:DATA.slide;$("#lvbox").classList.remove("hidden");$("#lvs").innerHTML=a.map(x=>`<button data-n="${x}">${x}×${x}</button>`).join("");$("#lvs button").forEach(x=>x.onclick=()=>go(+x.dataset.n))});function go(x){n=x;mv=placed=0;start=Date.now();clearInterval(timer);timer=setInterval(tick,500);$("#setup").classList.add("hidden");$("#play").classList.remove("hidden");$("#ttl").textContent=`${c.name}｜${mode==="fit"?"はめる":"スライド"} ${n}×${n}`;$("#moves").textContent="0手";tick();mode==="fit"?fit():slide()}
function slide(){let a=[...Array(n*n).keys()],z=n*n-1;for(let k=0;k<n*n*35;k++){let r=Math.floor(z/n),q=z%n,o=[];if(r)o.push(z-n);if(r<n-1)o.push(z+n);if(q)o.push(z-1);if(q<n-1)o.push(z+1);let p=o[Math.floor(Math.random()*o.length)];[a[z],a[p]]=[a[p],a[z]];z=p}$("#board").dataset.a=JSON.stringify(a);$("#tray").innerHTML="";draw()}function draw(){let b=$("#board"),a=JSON.parse(b.dataset.a);b.innerHTML="";a.forEach((v,p)=>{if(v===n*n-1)return;let e=document.createElement("div"),r=Math.floor(p/n),q=p%n,rr=Math.floor(v/n),cc=v%n;e.className="tile";Object.assign(e.style,{width:100/n+"%",height:100/n+"%",left:q*100/n+"%",top:r*100/n+"%"});bg(e,rr,cc);e.onclick=()=>move(p);b.appendChild(e)})}function move(p){let b=$("#board"),a=JSON.parse(b.dataset.a),z=a.indexOf(n*n-1),r=Math.floor(p/n),q=p%n,zr=Math.floor(z/n),zq=z%n;if(Math.abs(r-zr)+Math.abs(q-zq)!==1)return;[a[p],a[z]]=[a[z],a[p]];b.dataset.a=JSON.stringify(a);$("#moves").textContent=++mv+"手";draw();if(a.every((v,i)=>v===i))done()}
function fit(){let b=$("#board"),t=$("#tray");b.innerHTML=t.innerHTML="";for(let i=0;i<n*n;i++){let s=document.createElement("div"),r=Math.floor(i/n),q=i%n;s.className="tile";s.dataset.slot=i;Object.assign(s.style,{width:100/n+"%",height:100/n+"%",left:q*100/n+"%",top:r*100/n+"%",background:"rgba(255,255,255,.25)"});b.appendChild(s)}[...Array(n*n).keys()].sort(()=>Math.random()-.5).forEach(i=>{let e=document.createElement("div");e.className="tray";e.draggable=true;e.dataset.piece=i;bg(e,Math.floor(i/n),i%n);e.ondragstart=v=>v.dataTransfer.setData("text/plain",i);e.onpointerup=v=>{if(v.pointerType!=="mouse"){let s=document.elementFromPoint(v.clientX,v.clientY)?.closest("[data-slot]");if(s)put(e,s)}};t.appendChild(e)})}$("#board").ondragover=e=>e.preventDefault();$("#board").ondrop=e=>{e.preventDefault();let x=document.querySelector(`.tray[data-piece="${e.dataTransfer.getData("text/plain")}"]`),s=document.elementFromPoint(e.clientX,e.clientY)?.closest("[data-slot]");if(x&&s)put(x,s)};function put(e,s){$("#moves").textContent=++mv+"手";if(e.dataset.piece===s.dataset.slot){let i=+e.dataset.piece;s.style.background="";bg(s,Math.floor(i/n),i%n);e.remove();if(++placed===n*n)done()}}function done(){clearInterval(timer);let sec=Math.floor((Date.now()-start)/1000);$("#doneImg").src=im();$("#doneName").textContent=c.name;$("#stat").textContent=`${mv}手・${Math.floor(sec/60)}分${sec%60}秒`;$("#done").classList.remove("hidden")}$("#restart").onclick=()=>go(n);$("#quit").onclick=setup;$("#again").onclick=()=>{$("#done").classList.add("hidden");go(n)};$("#profile").onclick=()=>{if(c.linkId)location.href=(DATA.profileBase||"")+encodeURIComponent(c.linkId);else alert("紹介ページID未設定です")};let q=new URLSearchParams(location.search),id=q.get("char"),f=id?DATA.characters.find(x=>x.linkId===id&&x.published!==false&&x.images.length):null;if(f){c=f;setup()}else choose()}
drop($("#newDrop"),$("#newFiles"),fs=>{pending=fs.filter(x=>x.type.startsWith("image/"));$("#newInfo").textContent=pending.length?`${pending.length}枚選択`:"未選択"});$("#add").onclick=addChar;$("#fold").onclick=()=>$$("details.char").forEach((d,i)=>{if(i)d.open=false});$("#save").onclick=()=>{save();alert("保存しました")};$("#jsonOut").onclick=()=>{save();dl("MT_PUZZLE_DATA.json",JSON.stringify(data,null,2),"application/json")};$("#jsonIn").onclick=()=>$("#jsonFile").click();$("#jsonFile").onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.characters))throw 0;data=x;localStorage.setItem(KEY,JSON.stringify(data));render()}catch(_){alert("JSONを読み込めません")}};$("#export").onclick=()=>{try{save();let h=gameHTML();if(!h.includes("const DATA=")||!h.includes("function runtime"))throw Error("生成内容の検証に失敗");dl("index.html",h,"text/html")}catch(e){console.error(e);alert("index書き出しエラー: "+e.message)}};render();
</script></body></html>
