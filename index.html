 const im=()=>c.images[pic], cid=()=>c.linkId||c.name, pkey=(cc=c,pp=pic,mm=mode,nn=n)=>[cc.linkId||cc.name,pp,mm,nn].join("|");
 function safeGet(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(_){return null}}
 function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}
 function progress(){return safeGet(PK)||{}} function bests(){return safeGet(BK)||{}} function bestFor(cc=c,pp=pic,mm=mode,nn=n){return bests()[pkey(cc,pp,mm,nn)]??null} function updateBest(){let b=bests(),k=pkey(),old=b[k];if(old==null||mv<old){b[k]=mv;safeSet(BK,b);return {best:mv,newBest:true,old}}return {best:old,newBest:false,old}}
 function markClear(){if(!DATA.progressEnabled)return;let p=progress();p[pkey()]=true;safeSet(PK,p)}
 function clearResume(){try{localStorage.removeItem(RK)}catch(_){}}
 function saveResume(extra={}){if(!DATA.resumeEnabled||!c||!mode)return;let base={cid:cid(),pic,mode,n,mv,elapsed:elapsedBase+Math.floor((Date.now()-start)/1000),placed};safeSet(RK,Object.assign(base,extra))}
 function protect(root=document){if(DATA.allowImageSave)return;root.querySelectorAll("img").forEach(x=>{x.draggable=false;x.oncontextmenu=e=>e.preventDefault()});root.addEventListener("contextmenu",e=>{if(e.target.closest("img,.tile,.tray"))e.preventDefault()},{passive:false})}
 function tick(){let sec=elapsedBase+Math.floor((Date.now()-start)/1000);$("#tm").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
 function bg(e,r,col){e.style.backgroundImage=`url("${im()}")`;e.style.backgroundSize=`${n*100}% ${n*100}%`;e.style.backgroundPosition=`${col*100/(n-1||1)}% ${r*100/(n-1||1)}%`}
 function completedFor(x){let p=progress(),total=0,done=0;for(let pi=0;pi<x.images.length;pi++){for(const z of DATA.fit){total++;if(p[[x.linkId||x.name,pi,"fit",z].join("|")])done++}for(const z of DATA.slide){total++;if(p[[x.linkId||x.name,pi,"slide",z].join("|")])done++}}return{done,total}}
 function resumeOffer(){let r=safeGet(RK),box=$("#resumeBox");if(!DATA.resumeEnabled||!r){box.classList.add("hidden");return}let x=DATA.characters.find(z=>(z.linkId||z.name)===r.cid&&z.published!==false&&z.images.length);if(!x){clearResume();box.classList.add("hidden");return}box.classList.remove("hidden");box.innerHTML=`<b>▶ 続きから</b><div class="help">${x.name}｜${r.mode==="fit"?"はめる":"スライド"} ${r.n}×${r.n}｜${r.mv||0}手</div><div class="row"><button id="resumeGo">続きから遊ぶ</button><button id="resumeClear" class="alt">最初から</button></div>`;$("#resumeGo").onclick=()=>{c=x;pic=Math.min(r.pic||0,x.images.length-1);mode=r.mode;n=r.n;mv=r.mv||0;elapsedBase=r.elapsed||0;start=Date.now();$("#select").classList.add("hidden");$("#resumeBox").classList.add("hidden");$("#play").classList.remove("hidden");$("#setup").classList.add("hidden");$("#ttl").textContent=`${c.name}｜${mode==="fit"?"はめる":"スライド"} ${n}×${n}`;$("#moves").textContent=mv+"手";clearInterval(timer);timer=setInterval(tick,500);tick();if(mode==="slide"&&Array.isArray(r.board)){let b=$("#board");b.dataset.a=JSON.stringify(r.board);$("#tray").innerHTML="";draw()}else{fit();mv=r.mv||0;$("#moves").textContent=mv+"手"}};$("#resumeClear").onclick=()=>{clearResume();box.classList.add("hidden")}}
 function sortedPublicCharacters(){let a=DATA.characters.filter(x=>x.published!==false&&x.images.length).map((c,i)=>({c,i})),v=$("#publicSort")?.value||safeGet("mtpz_sort_v1")||"default",coll=new Intl.Collator("ja");if($("#publicSort"))$("#publicSort").value=v;let ratio=x=>{let z=completedFor(x.c);return z.total?z.done/z.total:0};if(v==="name")a.sort((x,y)=>coll.compare(x.c.name,y.c.name));if(v==="progress")a.sort((x,y)=>ratio(y)-ratio(x)||x.i-y.i);if(v==="unfinished")a.sort((x,y)=>ratio(x)-ratio(y)||x.i-y.i);if(v==="newest")a.sort((x,y)=>(y.c.createdAt||0)-(x.c.createdAt||0)||y.i-x.i);return a.map(x=>x.c)}
 function choose(){clearInterval(timer);let a=sortedPublicCharacters();$("#select").classList.remove("hidden");$("#setup").classList.add("hidden");$("#play").classList.add("hidden");$("#choices").innerHTML=a.map((x,i)=>{let z=completedFor(x);return `<div class="choice" data-i="${i}"><img class="thumb" src="${x.thumb||x.images[0]}"><div><b>${x.name}</b>${DATA.progressEnabled?`<div class="progress">クリア ${z.done}/${z.total}</div>`:""}</div><button>遊ぶ</button></div>`}).join("")||"<p class=center>公開中のキャラクターがありません。</p>";$$(".choice button").forEach(b=>b.onclick=()=>{c=a[+b.closest(".choice").dataset.i];hydrate(c).then(()=>{pic=0;setup()}).catch(()=>alert("パズル画像を読み込めませんでした。assetsフォルダを確認してください。"))});protect($("#choices"))}
 if($("#publicSort"))$("#publicSort").onchange=e=>{safeSet("mtpz_sort_v1",e.target.value);choose()};
 function setup(){if(!c)return choose();clearInterval(timer);$("#select").classList.add("hidden");$("#setup").classList.remove("hidden");$("#play").classList.add("hidden");$("#hero").src=c.thumb||im();$("#gn").textContent=c.name;$("#lvbox").classList.add("hidden");$("#pics").innerHTML=c.images.length>1?c.images.map((x,i)=>`<button class="${i===pic?"":"alt"} p" data-i="${i}">画像${i+1}</button>`).join(" "):"";$$(".p").forEach(b=>b.onclick=()=>{pic=+b.dataset.i;setup()});protect($("#setup"))}
 $$(".modes button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;let a=mode==="fit"?DATA.fit:DATA.slide,p=progress();$("#lvbox").classList.remove("hidden");$("#lvs").innerHTML=a.map(x=>{let k=pkey(c,pic,mode,x),bm=bests()[k];return `<button data-n="${x}">${x}×${x}${DATA.progressEnabled&&p[k]?" ✓":""}${bm!=null?`<br><small>BEST ${bm}手</small>`:""}</button>`}).join("");$$("#lvs button").forEach(x=>x.onclick=()=>go(+x.dataset.n))});
 function go(x){n=x;mv=placed=0;elapsedBase=0;start=Date.now();clearInterval(timer);timer=setInterval(tick,500);$("#setup").classList.add("hidden");$("#play").classList.remove("hidden");$("#ttl").textContent=`${c.name}｜${mode==="fit"?"はめる":"スライド"} ${n}×${n}`;$("#moves").textContent="0手";tick();mode==="fit"?fit():slide();saveResume()}
 function slide(){let a=[...Array(n*n).keys()],z=n*n-1;for(let k=0;k<n*n*35;k++){let r=Math.floor(z/n),q=z%n,o=[];if(r)o.push(z-n);if(r<n-1)o.push(z+n);if(q)o.push(z-1);if(q<n-1)o.push(z+1);let p=o[Math.floor(Math.random()*o.length)];[a[z],a[p]]=[a[p],a[z]];z=p}$("#board").dataset.a=JSON.stringify(a);$("#tray").innerHTML="";draw();saveResume({board:a})}
 function draw(){let b=$("#board"),a=JSON.parse(b.dataset.a);b.innerHTML="";a.forEach((v,p)=>{if(v===n*n-1)return;let e=document.createElement("div"),r=Math.floor(p/n),q=p%n,rr=Math.floor(v/n),cc=v%n;e.className="tile";Object.assign(e.style,{width:100/n+"%",height:100/n+"%",left:q*100/n+"%",top:r*100/n+"%"});bg(e,rr,cc);e.onclick=()=>move(p);b.appendChild(e)});protect(b)}
 function move(p){let b=$("#board"),a=JSON.parse(b.dataset.a),z=a.indexOf(n*n-1),r=Math.floor(p/n),q=p%n,zr=Math.floor(z/n),zq=z%n;if(Math.abs(r-zr)+Math.abs(q-zq)!==1)return;[a[p],a[z]]=[a[z],a[p]];b.dataset.a=JSON.stringify(a);$("#moves").textContent=++mv+"手";draw();saveResume({board:a});if(a.every((v,i)=>v===i))done()}
 function fit(){let b=$("#board"),t=$("#tray");b.innerHTML=t.innerHTML="";for(let i=0;i<n*n;i++){let z=document.createElement("div"),r=Math.floor(i/n),q=i%n;z.className="tile";z.dataset.slot=i;Object.assign(z.style,{width:100/n+"%",height:100/n+"%",left:q*100/n+"%",top:r*100/n+"%",background:"rgba(255,255,255,.25)"});b.appendChild(z)}[...Array(n*n).keys()].sort(()=>Math.random()-.5).forEach(i=>{let e=document.createElement("div");e.className="tray";e.draggable=true;e.dataset.piece=i;bg(e,Math.floor(i/n),i%n);e.ondragstart=v=>v.dataTransfer.setData("text/plain",i);e.onpointerup=v=>{if(v.pointerType!=="mouse"){let z=document.elementFromPoint(v.clientX,v.clientY)?.closest("[data-slot]");if(z)put(e,z)}};t.appendChild(e)});protect(document)}
 $("#board").ondragover=e=>e.preventDefault();$("#board").ondrop=e=>{e.preventDefault();let x=document.querySelector(`.tray[data-piece="${e.dataTransfer.getData("text/plain")}"]`),z=document.elementFromPoint(e.clientX,e.clientY)?.closest("[data-slot]");if(x&&z)put(x,z)};
 function put(e,z){$("#moves").textContent=++mv+"手";if(e.dataset.piece===z.dataset.slot){let i=+e.dataset.piece;z.style.background="";bg(z,Math.floor(i/n),i%n);e.remove();placed++;saveResume();if(placed===n*n)done()}else saveResume()}
 function done(){clearInterval(timer);let sec=elapsedBase+Math.floor((Date.now()-start)/1000),br=updateBest();markClear();clearResume();$("#doneImg").src=im();$("#doneName").textContent=c.name;$("#stat").innerHTML=`${mv}手・${Math.floor(sec/60)}分${sec%60}秒<br><b>${br.newBest?(br.old==null?"🏆 BEST "+br.best+"手":"🎉 NEW BEST "+br.best+"手（前回 "+br.old+"手）"):"BEST "+br.best+"手"}</b>`;let pb=$("#profile"),hasProfile=!!String(c.linkId||"").trim();pb.classList.toggle("hidden",!hasProfile);pb.disabled=!hasProfile;pb.title=hasProfile?"":"連携ID未設定";$("#done").classList.remove("hidden");$("#done").scrollTop=0;let di=$("#done>div");if(di)di.scrollTop=0;protect($("#done"))}
 $("#restart").onclick=()=>go(n);$("#quit").onclick=setup;$("#closeDone").onclick=()=>{let d=$("#done");d.classList.add("hidden");d.scrollTop=0;setup()};$("#again").onclick=()=>{$("#done").classList.add("hidden");go(n)};
 $("#backLv").onclick=()=>{let keep=mode;$("#done").classList.add("hidden");setup();mode=keep;let btn=$(`.modes button[data-m="${keep}"]`);if(btn)btn.click()};
 $("#backChars").onclick=()=>{$("#done").classList.add("hidden");c=null;choose();resumeOffer()};
 $("#profile").onclick=()=>{let id=String(c?.linkId||"").trim();if(id)location.href="https://marine-pharmacy0963.github.io/MARINE-TRICK-CHARACTER/index.html?char="+encodeURIComponent(id);else alert("このキャラクターは連携ID未設定のため、キャラ紹介へ移動できません。MASTERで連携IDを設定してください。")};
 let q=new URLSearchParams(location.search),id=q.get("char"),f=id?DATA.characters.find(x=>x.linkId===id&&x.published!==false&&x.images.length):null;if(f){c=f;hydrate(c).then(setup).catch(()=>choose())}else{choose();resumeOffer()}protect(document)
})(DATA);</script></body></html>
